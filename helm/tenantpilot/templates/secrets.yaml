{{- /*
Two Secrets, split by privilege:
  <release>-app         runtime secrets for api / worker / mcp (least-privilege DB role)
  <release>-migrations  DB owner credentials - mounted ONLY into the migration initContainer
                        and the seed job, never into long-running pods.
Values are generated on first install and re-used on upgrade (lookup), so an upgrade never
rotates the JWT signing key (logging everyone out) or the encryption key (making stored
connector credentials unreadable). With secrets.existingSecret set, nothing is generated.
*/ -}}
{{- $fullname := include "tenantpilot.fullname" . -}}
{{- if and .Values.secrets.existingMigrationsSecret (not .Values.secrets.existingSecret) }}
{{- fail "secrets.existingMigrationsSecret requires secrets.existingSecret too (DATABASE_URL must match the app role password)" }}
{{- end }}
{{- $dbHost := include "tenantpilot.dbHost" . -}}
{{- if not .Values.secrets.existingMigrationsSecret }}
{{- if not .Values.postgres.enabled }}
{{- fail "postgres.enabled=false requires secrets.existingMigrationsSecret (owner credentials for your managed database)" }}
{{- end }}
{{- $old := (lookup "v1" "Secret" .Release.Namespace (printf "%s-migrations" $fullname)).data | default dict }}
{{- $ownerPw := get $old "POSTGRES_PASSWORD" | default "" | b64dec | default (randAlphaNum 32) }}
{{- $appPw := get $old "APP_DB_PASSWORD" | default "" | b64dec | default (randAlphaNum 32) }}
{{- $readerPw := get $old "BETACORP_DB_PASSWORD" | default "" | b64dec | default (randAlphaNum 24) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $fullname }}-migrations
  labels: {{- include "tenantpilot.labels" . | nindent 4 }}
type: Opaque
data:
  POSTGRES_PASSWORD: {{ $ownerPw | b64enc }}
  APP_DB_PASSWORD: {{ $appPw | b64enc }}
  BETACORP_DB_PASSWORD: {{ $readerPw | b64enc }}
  MIGRATIONS_DATABASE_URL: {{ printf "postgresql+asyncpg://%s:%s@%s:5432/%s" .Values.externalDatabase.ownerUser $ownerPw $dbHost .Values.externalDatabase.database | b64enc }}
{{- if not .Values.secrets.existingSecret }}
{{- $oldApp := (lookup "v1" "Secret" .Release.Namespace (printf "%s-app" $fullname)).data | default dict }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $fullname }}-app
  labels: {{- include "tenantpilot.labels" . | nindent 4 }}
type: Opaque
data:
  DATABASE_URL: {{ printf "postgresql+asyncpg://tenantpilot_app:%s@%s:5432/%s" $appPw $dbHost .Values.externalDatabase.database | b64enc }}
  JWT_SECRET: {{ get $oldApp "JWT_SECRET" | default (randAlphaNum 48 | b64enc) }}
  SERVICE_TOKEN_SECRET: {{ get $oldApp "SERVICE_TOKEN_SECRET" | default (randAlphaNum 48 | b64enc) }}
  SECRETS_MASTER_KEY: {{ get $oldApp "SECRETS_MASTER_KEY" | default (randAlphaNum 32 | b64enc | replace "+" "-" | replace "/" "_" | b64enc) }}
  ANTHROPIC_API_KEY: {{ .Values.secrets.anthropicApiKey | default ((get $oldApp "ANTHROPIC_API_KEY" | default "" | b64dec)) | b64enc }}
{{- end }}
{{- end }}
