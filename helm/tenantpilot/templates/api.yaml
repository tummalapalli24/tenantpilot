{{- $fullname := include "tenantpilot.fullname" . }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $fullname }}-api
  labels:
    {{- include "tenantpilot.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  {{- if not .Values.api.autoscaling.enabled }}
  replicas: {{ .Values.api.replicaCount }}
  {{- end }}
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxSurge: 1, maxUnavailable: 0}   # zero-downtime rollouts
  selector:
    matchLabels: {{- include "tenantpilot.selectorLabels" (dict "ctx" . "component" "api") | nindent 6 }}
  template:
    metadata:
      labels: {{- include "tenantpilot.selectorLabels" (dict "ctx" . "component" "api") | nindent 8 }}
      annotations:
        {{- include "tenantpilot.podAnnotations" . | nindent 8 }}
        {{- include "tenantpilot.metricsAnnotations" (dict "ctx" . "port" .Values.api.service.port) | nindent 8 }}
    spec:
      serviceAccountName: {{ include "tenantpilot.serviceAccountName" . }}
      securityContext: {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets: {{- toYaml . | nindent 8 }}
      {{- end }}
      initContainers:
        # Idempotent: role bootstrap + Alembic (advisory-locked) + grants. The owner
        # credentials exist only in this container, not in the API container below.
        - name: migrate
          image: {{ include "tenantpilot.backendImage" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["python", "-m", "apps.api.cli", "migrate"]
          envFrom:
            - configMapRef: {name: {{ $fullname }}-config}
            - secretRef: {name: {{ include "tenantpilot.secretName" . }}}
            - secretRef: {name: {{ include "tenantpilot.migrationsSecretName" . }}}
          securityContext: {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {cpu: 500m, memory: 384Mi}
          volumeMounts: {{- include "tenantpilot.tmpVolumeMount" . | nindent 12 }}
      containers:
        - name: api
          image: {{ include "tenantpilot.backendImage" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["python", "-m", "apps.api"]
          ports:
            - {name: http, containerPort: 8000}
          {{- include "tenantpilot.backendEnv" . | nindent 10 }}
          startupProbe:
            httpGet: {path: /api/health, port: http}
            periodSeconds: 2
            failureThreshold: 30
          livenessProbe:            # process is alive (no dependency checks - see routers/health.py)
            httpGet: {path: /api/health, port: http}
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:           # can serve traffic (Postgres + Redis reachable)
            httpGet: {path: /api/ready, port: http}
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          lifecycle:
            preStop:                # let the Service/Ingress stop routing before shutdown
              exec: {command: ["sleep", "5"]}
          resources: {{- toYaml .Values.api.resources | nindent 12 }}
          securityContext: {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          volumeMounts:
            {{- include "tenantpilot.tmpVolumeMount" . | nindent 12 }}
            - {name: uploads, mountPath: /data/uploads}
      terminationGracePeriodSeconds: 30
      volumes:
        - {name: tmp, emptyDir: {}}
        {{- include "tenantpilot.uploadsVolume" . | nindent 8 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $fullname }}-api
  labels:
    {{- include "tenantpilot.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  type: ClusterIP
  selector: {{- include "tenantpilot.selectorLabels" (dict "ctx" . "component" "api") | nindent 4 }}
  ports:
    - {name: http, port: {{ .Values.api.service.port }}, targetPort: http}
{{- if .Values.api.autoscaling.enabled }}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ $fullname }}-api
  labels: {{- include "tenantpilot.labels" . | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ $fullname }}-api
  minReplicas: {{ .Values.api.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.api.autoscaling.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: {type: Utilization, averageUtilization: {{ .Values.api.autoscaling.targetCPUUtilizationPercentage }}}
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 120   # avoid flapping when agent traffic is bursty
{{- end }}
{{- if .Values.api.podDisruptionBudget.enabled }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ $fullname }}-api
  labels: {{- include "tenantpilot.labels" . | nindent 4 }}
spec:
  minAvailable: {{ .Values.api.podDisruptionBudget.minAvailable }}
  selector:
    matchLabels: {{- include "tenantpilot.selectorLabels" (dict "ctx" . "component" "api") | nindent 6 }}
{{- end }}
