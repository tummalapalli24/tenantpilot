# `helm test <release>`: proves the API is reachable through its Service and ready.
apiVersion: v1
kind: Pod
metadata:
  name: {{ include "tenantpilot.fullname" . }}-test-api
  labels: {{- include "tenantpilot.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  automountServiceAccountToken: false
  securityContext: {{- toYaml .Values.podSecurityContext | nindent 4 }}
  containers:
    - name: ready
      image: {{ include "tenantpilot.backendImage" . }}
      imagePullPolicy: {{ .Values.image.pullPolicy }}
      command:
        - python
        - -c
        - |
          import json, urllib.request
          base = "http://{{ include "tenantpilot.fullname" . }}-api:{{ .Values.api.service.port }}"
          ready = json.load(urllib.request.urlopen(base + "/api/ready", timeout=10))
          assert ready["status"] == "ready", ready
          print("api ready:", ready)
      securityContext: {{- toYaml .Values.containerSecurityContext | nindent 8 }}
