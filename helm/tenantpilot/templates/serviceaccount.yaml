{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "tenantpilot.serviceAccountName" . }}
  labels: {{- include "tenantpilot.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations: {{- toYaml . | nindent 4 }}
  {{- end }}
# TenantPilot never talks to the Kubernetes API, so pods get no API token at all.
automountServiceAccountToken: false
{{- end }}
