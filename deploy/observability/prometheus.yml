# Scrapes TenantPilot's /metrics endpoints (docker compose service names).
global:
  scrape_interval: 10s
  evaluation_interval: 10s

scrape_configs:
  - job_name: tenantpilot-api
    static_configs: [{targets: ["api:8000"]}]
  - job_name: tenantpilot-mcp
    static_configs: [{targets: ["mcp-server:8765"]}]
  - job_name: tenantpilot-worker
    static_configs: [{targets: ["worker:9102"]}]
